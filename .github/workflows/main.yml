
name: CARXX GOLD SENSI APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name settings.gradle.kts | head -n 1)")
          cd "$PROJECT_DIR"
          test -f app/google-services.json || {
            echo "Missing app/google-services.json"
            exit 1
          }
          gradle assembleDebug
          echo "APK_PATH=$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CARXX-GOLD-SENSI-APK
          path: ${{ env.APK_PATH }}
          
